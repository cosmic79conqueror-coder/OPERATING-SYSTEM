<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUTO_OS // TELEMETRY TERMINAL</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <div class="hero-bg"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <!-- Arcade Drawer Strip -->
  <div class="gamestrip-trigger" id="gsTrigger">ARCADE</div>
  <div class="gamestrip-drawer hidden" id="gsDrawer">
    <div class="gs-header">
      <span>ARCADE STRIP</span>
      <button class="win-close-btn" id="gsClose">X</button>
    </div>
    <div class="gs-tabs">
      <button class="g-tab active" data-target="g-turbo">TURBO</button>
      <button class="g-tab" data-target="g-launch">LAUNCH</button>
      <button class="g-tab" data-target="g-shift">SHIFT</button>
    </div>
    <div class="gs-body">
      <div id="g-turbo" class="g-panel">
        <div class="stat-row"><span>HIGH SCORE</span><span id="highScoreVal">0</span></div>
        <div class="stat-row"><span>TIME LEFT</span><span id="timerVal">15s</span></div>
        <div id="turboCount" class="arcade-output">0 RPM</div>
        <button class="flash-btn arcade-boost-btn" id="revArcadeBtn">JAM THROTTLE</button>
      </div>

      <div id="g-launch" class="g-panel hidden">
        <div class="stat-row"><span>BEST REACTION TIME</span><span id="launchBest">-- ms</span></div>
        <div class="launch-signal" id="launchLight">WAIT FOR GREEN</div>
        <button class="flash-btn arcade-boost-btn" id="launchBtn">ENGAGE LAUNCH</button>
      </div>

      <div id="g-shift" class="g-panel hidden">
        <div class="stat-row"><span>REDLINE ACCURACY</span><span id="shiftScore">0%</span></div>
        <div id="shiftRpm" class="arcade-output" style="color:var(--neon-amber);">4000 RPM</div>
        <button class="flash-btn arcade-boost-btn amber-btn" id="shiftBtn">SNAP SHIFT</button>
      </div>

      <div class="quick-telemetry-box">
        <h3>TELEMETRY QUICK-CHECK</h3>
        <p id="quickPsi">BOOST: 14.0 PSI</p>
      </div>
    </div>
  </div>

  <!-- Boot Sequence -->
  <main class="boot-screen" id="bootScreen">
    <div class="rpm-gauge">
      <div class="needle" id="needle"></div>
      <div class="center-pin"></div>
    </div>
    <div class="boot-text">
      <h2 id="bootStatus" class="glitch-text">ECU FLASHING...</h2>
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </main>

  <!-- Ignition Screen -->
  <main class="hero hidden" id="ignitionScreen">
    <div class="container ignition-box">
      <h1 class="title glitch" data-text="WELCOME TO THE WORLD OF HORSEPOWER">
        welcome to the world of horsepower
      </h1>
      <p class="subtitle" id="typeWriter"></p>
      <button class="ignition-btn compact-ignition" id="startEngineBtn">IGNITION _</button>
    </div>
  </main>

  <!-- Desktop Environment -->
  <main class="desktop-environment hidden" id="desktopScreen">
    <nav class="top-bar">
      <div class="bar-left">
        <span class="os-logo">AUTO_OS <span class="version">v1.5</span></span>
      </div>
      
      <div class="bar-center telemetry">
        <div class="stat"><span class="label">CPU</span> <span class="value">BOOST <span id="topBarBoost">14</span> PSI</span></div>
        <div class="stat"><span class="label">BAND</span> <span class="value" id="hudBand">FM 98.3 MHz</span></div>
      </div>
      
      <div class="bar-right">
        <span class="network status-icon">ONLINE</span>
        <span class="battery status-icon">ALT 67.9V</span>
      </div>
    </nav>            

    <div class="desktop-workspace">
      <div class="app-grid">
        <button class="app-icon" data-name="Engine Control">
          <div class="icon-shape settings"></div><span>Settings</span>
        </button>
        <button class="app-icon" data-name="Telemetry">
          <div class="icon-shape telemetry-icon"></div><span>Monitor</span>
        </button>
        <button class="app-icon" data-name="Nav System">
          <div class="icon-shape nav"></div>
          <span>Navigation</span>
        </button>
        <button class="app-icon" data-name="Media Deck">
          <div class="icon-shape media"></div><span>Media</span>
        </button>
        <button class="app-icon" data-name="Garage">
          <div class="icon-shape files"></div><span>Files</span>
        </button>
        <button class="app-icon" data-name="Calendar">
          <div class="icon-shape calendar-icon"></div><span>Calendar</span>
        </button>
        <button class="app-icon" data-name="Console">
          <div class="icon-shape console-icon"></div><span>Console</span>
        </button>
        <button class="app-icon" data-name="Diagnostics">
          <div class="icon-shape diag-icon"></div><span>Diag</span>
        </button>
      </div> 

      <div class="widget-container">
        <div class="chronometer">
          <div class="ring outer-ring"></div>
          <div class="ring inner-ring"></div>
          
          <div class="time-display">
            <div class="date" id="dateDisplay">--</div>
            <div class="time" id="timeDisplay">
              <span id="hours">00</span><span class="colon">:</span><span id="minutes">00</span>
            </div>
            <div class="seconds-container">
              <span id="seconds">00</span> <span id="ampm">AM</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
